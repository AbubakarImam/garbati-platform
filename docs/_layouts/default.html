<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-brand" href="{{ '/' | relative_url }}">GARBATI</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="is-active"{% endif %}>Home</a>
        <a href="{{ '/architecture/' | relative_url }}"{% if page.url contains '/architecture' %} class="is-active"{% endif %}>Architecture</a>
        <a href="{{ '/replicate/' | relative_url }}"{% if page.url contains '/replicate' %} class="is-active"{% endif %}>Replicate It</a>
        <a href="{{ '/research/' | relative_url }}"{% if page.url contains '/research' %} class="is-active"{% endif %}>Research</a>
        <a href="https://github.com/AbubakarImam/garbati-platform">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>GARBATI is open source (Apache-2.0). Built by a solo developer and a small team of agents, one task at a time.</span>
      <span><a href="https://github.com/AbubakarImam/garbati-platform">View the source on GitHub</a></span>
    </div>
  </footer>

  <script>
    // Give every table kramdown renders its own horizontal-scroll container, instead of the
    // page body scrolling sideways. Done here, at runtime, rather than in the markdown source,
    // because two of these pages render real tables straight out of ARCHITECTURE.md and
    // DEPLOYMENT-RUNBOOK.md (mirrored into docs/_includes/ by scripts/sync_docs.py) - there is
    // no good place to hand-add a wrapper div without editing a file this repo's own hard rule
    // says never to hand-edit.
    (function () {
      document.querySelectorAll("main table").forEach(function (table) {
        if (table.parentElement && table.parentElement.classList.contains("table-scroll")) {
          return;
        }
        var wrap = document.createElement("div");
        wrap.className = "table-scroll";
        table.parentNode.insertBefore(wrap, table);
        wrap.appendChild(table);
      });
    })();
  </script>
</body>
</html>
